spring.application.name=pokedex-backend

# ===============================
# CONFIGURACIÓN DE POSTGRESQL
# ===============================
# Las credenciales NO se guardan en el repositorio.
# Cada integrante crea su propio archivo src/main/resources/application-local.properties
# (está en .gitignore) copiando application-local.properties.example.
# También se pueden pasar como variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pokedex_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURACIÓN JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# PAGINACIÓN
# ===============================
# Tamaño por defecto y máximo de página para ?page=&size=
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=200
