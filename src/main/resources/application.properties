spring.application.name=pokedex-backend

# ===============================
# CONFIGURACIÓN DE POSTGRESQL
# ===============================
# Las credenciales NO se guardan en el repositorio.
# Cada integrante crea su propio archivo src/main/resources/application-local.properties
# (está en .gitignore) copiando application-local.properties.example.
# También se pueden pasar como variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pokedex_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURACIÓN JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Carga por lotes de las relaciones (tipos y rutas de cada Pokémon).
# Sin esto, una página de 20 Pokémon hace 1 consulta + 2 por cada Pokémon (problema N+1).
# Con esto, Hibernate carga los tipos y las rutas de hasta 50 Pokémon en una sola consulta.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Las relaciones se cargan cuando se convierten a JSON, así que la sesión de BD
# debe seguir abierta durante la respuesta. Es el valor por defecto; se deja explícito
# para que Spring no muestre la advertencia al arrancar.
spring.jpa.open-in-view=true

# ===============================
# PAGINACIÓN
# ===============================
# Tamaño por defecto y máximo de página para ?page=&size=
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=200

# Formato fijo del JSON paginado: { "content": [...], "page": { size, number, totalElements, totalPages } }
# Sin esto, Spring serializa su clase interna PageImpl, cuyo formato puede cambiar entre versiones.
spring.data.web.pageable.serialization-mode=via-dto

# ===============================
# SEGURIDAD (F15)
# ===============================
# Los valores NO se guardan en el repositorio: se definen en application-local.properties
# (JWT_SECRETO=..., ADMIN_USERNAME=..., ADMIN_PASSWORD=...) o como variables de entorno.
# Sin JWT_SECRETO (al menos 32 caracteres) el servidor no arranca.
pokedex.seguridad.jwt-secreto=${JWT_SECRETO:}
pokedex.seguridad.admin-usuario=${ADMIN_USERNAME:}
pokedex.seguridad.admin-contrasena=${ADMIN_PASSWORD:}
# Duración del token del login
pokedex.seguridad.token-minutos=120
# Orígenes que pueden llamar a la API desde el navegador (separados por comas)
pokedex.seguridad.cors-origenes=${CORS_ORIGENES:http://localhost:3000,http://127.0.0.1:3000}

# ===============================
# SCRIPT AL ARRANCAR
# ===============================
# Ejecuta schema.sql en cada arranque: crea la extensión unaccent (búsqueda sin tildes, F9)
# si no existe. El esquema de las tablas lo sigue manejando Hibernate (ddl-auto=update).
spring.sql.init.mode=always
